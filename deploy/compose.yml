# Production-shaped single-host stack: PostgreSQL, one release job, one API,
# one worker, and Caddy for TLS. Copy `production.env.example` to
# `production.env`, fill it in, and run:
#
#   docker compose -f deploy/compose.yml up -d --build
#
# The API and worker share the image and the storage volume. A managed database
# or bucket can replace the bundled `db` or the local `storage` volume; see
# docs/RUNBOOK.md. The API port is never published: only Caddy reaches it.

name: nero

x-app: &app
  image: ${NERO_IMAGE:-nero-ai-back}:${NERO_IMAGE_TAG:-latest}
  env_file:
    - production.env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - storage:/app/storage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the compose environment or an env file}
      POSTGRES_DB: ${POSTGRES_DB:-nero}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  release:
    <<: *app
    # The image is built once here and reused by the API and worker. Building it
    # under every service would run the same Docker build in parallel.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-server-header
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${NERO_HTTP_PORT:-80}:80"
      - "${NERO_HTTPS_PORT:-443}:443"
    environment:
      NERO_DOMAIN: ${NERO_DOMAIN:?set NERO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage:
  caddy-data:
  caddy-config:
