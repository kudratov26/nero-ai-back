name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: test
  APP_SECRET: ci-only-not-for-production
  FRONTEND_ORIGIN: http://localhost:3000
  DATABASE_URL: postgresql+asyncpg://nero:nero@localhost:5432/nero_test
  TEST_DATABASE_URL: postgresql+asyncpg://nero:nero@localhost:5432/nero_test

jobs:
  checks:
    name: Format, lint, types, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nero
          POSTGRES_PASSWORD: nero
          POSTGRES_DB: nero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nero -d nero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Migrate a clean database
        run: |
          uv run alembic upgrade head
          uv run alembic current

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nero-ai-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max